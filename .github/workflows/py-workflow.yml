name: Deploy Workflow
on:
  push:
    branches:
      - main
jobs:
  deploy:
    runs-on: [self-hosted,testing]
    steps:
      - name: checkout-code
        uses: actions/checkout@v3

      - name: name build image 
        run: |
          sudo docker build -t latesh98/task-app:${{ github.sha }} .
      - name: login to docker hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PASSWORD }}
      - name: Push Image to docker hub
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: latesh98/task-app:${{ github.sha }}

      - name: Deploy
        run: sudo docker run -d -p 5000:5000 latesh98/task-app:${{ github.sha }}
