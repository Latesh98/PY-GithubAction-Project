name: Deploy Workflow
on:
  push:
    branches:
      - main
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: checkout-code
        uses: actions/checkout@v3

      - name: name build image 
        run: |
          docker build -t latesh98/task-app::{{$GITHUB_SHA}} .

      - name: Push Image to docker hub
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: latesh98/task-app::{{$GITHUB_SHA}}

      - name: Deploy
        run: docker run -d -p 5000:5000 latesh98/task-app::{{$GITHUB_SHA}}